<!-- apps/browser.html -->
<style>
  .browser-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .browser-bar {
    display: flex;
    padding: 5px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }

  .browser-bar input {
    flex: 1;
    padding: 5px 10px;
    border-radius: 6px;
    border: none;
    outline: none;
    font-size: 14px;
  }

  .browser-view {
    flex: 1;
    border: none;
    width: 100%;
  }
</style>

<div class="browser-wrapper">
  <div class="browser-bar">
    <input type="text" id="url-input" placeholder="Enter URL and hit Enter" />
  </div>
  <iframe class="browser-view" id="browser-frame" src="https://info.com" frameborder="0" allowfullscreen></iframe>
</div>

<script>
  const input = document.getElementById('url-input');
  const frame = document.getElementById('browser-frame');

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      let url = input.value.trim();
      if (!url.startsWith('http')) url = 'https://' + url;
      frame.src = url;
    }
  });
</script>

<script>
    // on clcking anywhere on page, fullscreen the page
    document.addEventListener("click", function(event) {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
            });
        }
    });
</script>
<script>
    // Function to check if the input is a valid URL
    function isValidUrl(input) {
        try {
            new URL(input);
            return true;
        } catch (_) {
            return false;
        }
    }

    // Handle search or navigation
    document.getElementById("google-search-btn").addEventListener("click", function () {
        const input = document.getElementById("google-search-input").value.trim();
        if (isValidUrl(input)) {
            // If valid URL, open in a new tab
            window.open(input.startsWith("http") ? input : `https://${input}`, "_blank");
        } else {
            // Otherwise, search on Google in a new tab
            window.open(`https://www.google.com/search?q=${encodeURIComponent(input)}`, "_blank");
        }
    });

    // Same for Enter key
    document.getElementById("google-search-input").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            const input = document.getElementById("google-search-input").value.trim();
            if (isValidUrl(input)) {
                window.open(input.startsWith("http") ? input : `https://${input}`, "_blank");
            } else {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(input)}`, "_blank");
            }
        }
    });
</script>
